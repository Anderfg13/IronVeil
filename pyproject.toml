[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironveil"
version = "1.0.0"
description = "Defensa en profundidad para LLMs autoalojados (Ollama): proxy FastAPI con 5 mecanismos activables por bandera"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Equipo IronVeil (Fiquitiva, García, Sabogal, Piedrahita)" },
]
keywords = ["llm", "security", "prompt-injection", "ollama", "guardrails", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Framework :: FastAPI",
]
# Mismos pines exactos que proxy/requirements.in (convencion del proyecto).
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",
  "PyYAML==6.0.2",
  "transformers==5.17.0",
]

[project.optional-dependencies]
# Clasificador de entrada (Llama Prompt Guard 2): PyTorch aparte, para elegir CPU o GPU.
prompt-guard = ["torch"]

[project.urls]
Repository = "https://github.com/Anderfg13/IronVeil"
Documentation = "https://anderfg13.github.io/IronVeil/"

[project.scripts]
ironveil = "proxy.cli:main"

# El paquete se importa como `proxy` (asi lo usa el resto del repositorio).
[tool.setuptools.packages.find]
include = ["proxy*"]
namespaces = true

[tool.setuptools.package-data]
proxy = ["static/*"]

# Black infiere las versiones de Python de `requires-python`; se fija para que el
# formato no dependa de la version del interprete que lo ejecute.
[tool.black]
target-version = ["py311"]
