services:
  ollama:
    image: ollama/ollama:latest
    container_name: ironveil-ollama
    environment:
      # Cuantos modelos puede tener cargados a la vez. Con los modelos de la demo
      # (soporte/rrhh/rrhh-agente + llama-guard3) un valor bajo hace que un
      # modelo expulse a otro de memoria y la siguiente peticion pague una
      # recarga (cola de latencia). 3 es el valor por defecto de Ollama; sube a 4
      # solo si la maquina tiene memoria de sobra (p. ej. la GPU T4 de Colab).
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ironveil-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Sin "ports": solo es alcanzable dentro de la red interna de Docker.

  ollama-init:
    image: ollama/ollama:latest
    container_name: ironveil-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama/modelfiles:/modelfiles:ro
      - ./ollama/init.sh:/init.sh:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
      BASE_MODEL: ${BASE_MODEL:-llama3.2}
      SPT_SECRET: ${SPT_SECRET}
      RRHH_SECRET: ${RRHH_SECRET}
      MODELO_CLASIFICADOR: ${MODELO_CLASIFICADOR:-llama-guard3:1b}
    networks:
      - ironveil-net
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: ironveil-proxy
    ports:
      - "${PROXY_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODELO_CLASIFICADOR: ${MODELO_CLASIFICADOR:-llama-guard3:1b}
      # Mecanismo 3, direccion "entrada" (Llama Prompt Guard 2, via Hugging
      # Face, NO via Ollama). HF_TOKEN es obligatorio: es un modelo con
      # licencia restringida. Sin el, clasificar() en entrada falla cerrado
      # (unsafe) en cada peticion -- ver docs/FUENTE_DE_VERDAD.md, seccion 4.
      MODELO_PROMPT_GUARD_ID: ${MODELO_PROMPT_GUARD_ID:-meta-llama/Llama-Prompt-Guard-2-86M}
      HF_TOKEN: ${HF_TOKEN}
      # Latencia del clasificador (sin cambiar lo que revisa): tope de tokens de
      # la respuesta de Llama Guard y media precision de Prompt Guard con GPU.
      LLAMA_GUARD_MAX_TOKENS: ${LLAMA_GUARD_MAX_TOKENS:-32}
      PROMPT_GUARD_FP16: ${PROMPT_GUARD_FP16:-1}
      # Adaptador del clasificador (proxy/adaptador_clasificador.py): vacias = el
      # perfil por defecto del modelo. Ver docs/CAMBIAR_MODELO_CLASIFICADOR.md.
      CLASIFICADOR_ENTRADA_BACKEND: ${CLASIFICADOR_ENTRADA_BACKEND:-huggingface}
      CLASIFICADOR_ENTRADA_ETIQUETAS_MALICIOSAS: ${CLASIFICADOR_ENTRADA_ETIQUETAS_MALICIOSAS:-}
      CLASIFICADOR_ENTRADA_ETIQUETAS_BENIGNAS: ${CLASIFICADOR_ENTRADA_ETIQUETAS_BENIGNAS:-}
      CLASIFICADOR_SALIDA_VEREDICTOS_INSEGUROS: ${CLASIFICADOR_SALIDA_VEREDICTOS_INSEGUROS:-}
      CLASIFICADOR_SALIDA_VEREDICTOS_SEGUROS: ${CLASIFICADOR_SALIDA_VEREDICTOS_SEGUROS:-}
      # Cuanto tiempo mantiene Ollama un modelo cargado en memoria tras la
      # ultima peticion (nativo de su API). 30m por defecto, mas que el 5m
      # de Ollama, para que una pausa entre peticiones (demo en vivo,
      # bateria de ataques con huecos) no fuerce una recarga en frio.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Extensiones opcionales (vacias = apagadas). Ver .env.example.
      MODELOS_CON_HERRAMIENTAS: ${MODELOS_CON_HERRAMIENTAS:-}
      # Exportacion de cada evento a un archivo en formato Wazuh JSON (ver
      # docs/siem/wazuh/LEEME.md). Vacio = apagada. La ruta es DENTRO del
      # contenedor; ./docs/siem/exportados se monta mas abajo.
      SIEM_ARCHIVO_WAZUH: ${SIEM_ARCHIVO_WAZUH:-}
      # Login de la consola de revision humana (vacio = sin login, como antes).
      # Genera cada cuenta con: python -m proxy.auth USUARIO [revisor|observador]
      # Pantalla de chat de la demo en /demo (vacio = apagada). Usa POST /chat.
      IRONVEIL_DEMO: ${IRONVEIL_DEMO:-}
      REVISION_USUARIOS: ${REVISION_USUARIOS:-}
      REVISION_SESION_MINUTOS: ${REVISION_SESION_MINUTOS:-30}
      REVISION_COOKIE_SECURE: ${REVISION_COOKIE_SECURE:-1}
      NOTIFICAR_WEBHOOK_URL: ${NOTIFICAR_WEBHOOK_URL:-}
      NOTIFICAR_SLACK_WEBHOOK_URL: ${NOTIFICAR_SLACK_WEBHOOK_URL:-}
      REVISION_URL_BASE: ${REVISION_URL_BASE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      NOTIFICAR_CORREO_DESTINO: ${NOTIFICAR_CORREO_DESTINO:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_ORIGEN: ${TWILIO_WHATSAPP_ORIGEN:-}
      NOTIFICAR_WHATSAPP_DESTINO: ${NOTIFICAR_WHATSAPP_DESTINO:-}
    volumes:
      # Monta config.yaml (no se copia en la imagen) para poder cambiar de
      # configuracion (C0..C6) con solo editar el archivo y reiniciar el
      # contenedor, sin rebuild. resultados/ persiste los logs JSONL crudos
      # en el host: son evidencia, no deben perderse si el contenedor cae.
      - ./config.yaml:/app/config.yaml:ro
      - ./resultados:/app/resultados
      - ./docs/siem/exportados:/app/siem
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - ironveil-net
    restart: unless-stopped

networks:
  ironveil-net:
    driver: bridge

volumes:
  ollama_data:
