services:
  ollama:
    image: ollama/ollama:latest
    container_name: ironveil-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ironveil-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Sin "ports": solo es alcanzable dentro de la red interna de Docker.

  ollama-init:
    image: ollama/ollama:latest
    container_name: ironveil-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama/modelfiles:/modelfiles:ro
      - ./ollama/init.sh:/init.sh:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
      BASE_MODEL: ${BASE_MODEL:-llama3.2}
      SPT_SECRET: ${SPT_SECRET}
      RRHH_SECRET: ${RRHH_SECRET}
      MODELO_CLASIFICADOR: ${MODELO_CLASIFICADOR:-llama-guard3:1b}
    networks:
      - ironveil-net
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: ironveil-proxy
    ports:
      - "${PROXY_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MODELO_CLASIFICADOR: ${MODELO_CLASIFICADOR:-llama-guard3:1b}
      # Mecanismo 3, direccion "entrada" (Llama Prompt Guard 2, via Hugging
      # Face, NO via Ollama). HF_TOKEN es obligatorio: es un modelo con
      # licencia restringida. Sin el, clasificar() en entrada falla cerrado
      # (unsafe) en cada peticion -- ver docs/FUENTE_DE_VERDAD.md, seccion 4.
      MODELO_PROMPT_GUARD_ID: ${MODELO_PROMPT_GUARD_ID:-meta-llama/Llama-Prompt-Guard-2-86M}
      HF_TOKEN: ${HF_TOKEN}
      # Cuanto tiempo mantiene Ollama un modelo cargado en memoria tras la
      # ultima peticion (nativo de su API). 30m por defecto, mas que el 5m
      # de Ollama, para que una pausa entre peticiones (demo en vivo,
      # bateria de ataques con huecos) no fuerce una recarga en frio.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Extensiones opcionales (vacias = apagadas). Ver .env.example.
      MODELOS_CON_HERRAMIENTAS: ${MODELOS_CON_HERRAMIENTAS:-}
      # Exportacion de cada evento a un archivo en formato Wazuh JSON (ver
      # docs/siem/wazuh/LEEME.md). Vacio = apagada. La ruta es DENTRO del
      # contenedor; ./docs/siem/exportados se monta mas abajo.
      SIEM_ARCHIVO_WAZUH: ${SIEM_ARCHIVO_WAZUH:-}
      NOTIFICAR_WEBHOOK_URL: ${NOTIFICAR_WEBHOOK_URL:-}
      NOTIFICAR_SLACK_WEBHOOK_URL: ${NOTIFICAR_SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      NOTIFICAR_CORREO_DESTINO: ${NOTIFICAR_CORREO_DESTINO:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_ORIGEN: ${TWILIO_WHATSAPP_ORIGEN:-}
      NOTIFICAR_WHATSAPP_DESTINO: ${NOTIFICAR_WHATSAPP_DESTINO:-}
    volumes:
      # Monta config.yaml (no se copia en la imagen) para poder cambiar de
      # configuracion (C0..C6) con solo editar el archivo y reiniciar el
      # contenedor, sin rebuild. resultados/ persiste los logs JSONL crudos
      # en el host: son evidencia, no deben perderse si el contenedor cae.
      - ./config.yaml:/app/config.yaml:ro
      - ./resultados:/app/resultados
      - ./docs/siem/exportados:/app/siem
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - ironveil-net
    restart: unless-stopped

networks:
  ironveil-net:
    driver: bridge

volumes:
  ollama_data:
