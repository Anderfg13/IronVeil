<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 810" width="1520" height="810" role="img" aria-labelledby="t d">
<title id="t">Diagrama de clases de IronVeil</title>
<desc id="d">Clases y puertos de los paquetes proxy, memoria_decisiones, siem, normalizacion y auth; los adaptadores implementan los Protocol y los servicios dependen de ellos.</desc>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"JetBrains Mono",monospace;white-space:pre}
 .t{font-size:13px;font-weight:700} .e{font-size:10px;fill:#94a3b8} .m{font-size:10.5px;fill:#cbd5e1} .s{font-size:10.5px;fill:#94a3b8}
 .h{font-size:12px;font-weight:700;letter-spacing:.12em} .big{font-size:20px;font-weight:700;fill:#f8fafc}
 .rel{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 6;animation:marcha 1.4s linear infinite}
 .rel.impl{stroke:#94a3b8}
 .foco{opacity:0;animation:foco 12s ease-in-out infinite}
 @keyframes marcha{to{stroke-dashoffset:-12}}
 @keyframes foco{0%,100%{opacity:0}8%,22%{opacity:.13}30%{opacity:0}}
 @media (prefers-reduced-motion:reduce){.rel,.foco{animation:none}}
</style>
