<g opacity="0"><text x="1015" y="596" text-anchor="middle" class="s" font-size="9" fill="#fb7185">ataque → alerta en el SIEM</text><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.69;0.700;0.715;0.725;1.0000"/></g>
<g opacity="0"><text x="1015" y="596" text-anchor="middle" class="s" font-size="9" fill="#fb7185">ataque → alerta en el SIEM</text><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.975;0.985;0.990;1.0;1.0000"/></g>
