<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 640" width="1110" height="640" role="img" aria-labelledby="t d">
<title id="t">Arquitectura de IronVeil animada</title>
<desc id="d">Una petición legítima pasa primero por la autenticación opcional (usuario y clave, o sesión) y atraviesa filtrado, clasificación, mínimo privilegio y delimitación, llega a Ollama y su respuesta vuelve por filtrado y clasificación de salida. Después un ataque es detenido por la clasificación y la aprobación humana lo encola con un 429. Cada evento sale también hacia uno o varios SIEM, y los de ataque generan alerta. Por último, el mismo mensaje vuelve a llegar y la memoria de decisiones, que recuerda el rechazo de la persona, lo rechaza al instante. El modelo protegido y los clasificadores pueden ser locales o de frontera.</desc>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"JetBrains Mono",monospace}
 .t{font-size:14px;font-weight:700;fill:#f8fafc} .s{font-size:10.5px;fill:#94a3b8} .num{font-size:12px;font-weight:700}
 .h{font-size:12px;fill:#94a3b8;letter-spacing:.12em} .big{font-size:20px;font-weight:700;fill:#f8fafc}
 .flujo{stroke-dasharray:6 8;animation:marcha 1.2s linear infinite}
 @keyframes marcha{to{stroke-dashoffset:-14}}
 @media (prefers-reduced-motion:reduce){.flujo{animation:none}}
</style>
<defs>
 <marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
 <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1110" height="640" rx="16" fill="#020617"/>
<text x="30" y="34" class="big">IronVeil · pipeline de defensa en profundidad</text>
<text x="30" y="54" class="s">mismo código, 7 configuraciones: solo cambia config.yaml</text>

<!-- leyenda -->
<circle cx="760" cy="30" r="6" fill="#34d399"/><text x="772" y="34" class="s">petición legítima</text>
<circle cx="900" cy="30" r="6" fill="#fb7185"/><text x="912" y="34" class="s">ataque</text>

<!-- Proxy -->
<rect x="210" y="70" width="700" height="520" rx="16" fill="#0b1220" stroke="#334155" stroke-dasharray="5 5"/>
<text x="228" y="90" class="h">PROXY FASTAPI · :8000 (único puerto publicado)</text>
<text x="240" y="117" class="h" font-size="10">ENTRADA</text>

<!-- Cliente -->
<rect x="30" y="265" width="140" height="70" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/>
<text x="100" y="296" text-anchor="middle" class="t">Cliente</text><text x="100" y="316" text-anchor="middle" class="s">POST /chat</text>


<!-- autenticacion opcional: la puerta del proxy -->
<g>
 <rect x="182" y="268" width="46" height="64" rx="8" fill="#0f172a" stroke="#a3e635" stroke-width="1.6" stroke-dasharray="6 4"/>
 <path d="M197,293 L197,288 A8,8 0 0 1 213,288 L213,293" fill="none" stroke="#a3e635" stroke-width="2"/>
 <rect x="193" y="293" width="24" height="18" rx="3" fill="#a3e635"/>
 <circle cx="205" cy="302" r="2.5" fill="#0f172a"/>
</g>
<rect x="182" y="268" width="46" height="64" rx="8" fill="#a3e635" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.5;0;0" keyTimes="0.0000;0.0100;0.0200;0.0600;1.0000"/></rect><rect x="182" y="268" width="46" height="64" rx="8" fill="#a3e635" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.5;0;0" keyTimes="0.0000;0.4100;0.4200;0.4600;1.0000"/></rect><rect x="182" y="268" width="46" height="64" rx="8" fill="#a3e635" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.5;0;0" keyTimes="0.0000;0.6900;0.7000;0.7400;1.0000"/></rect>
<g>
 <rect x="30" y="350" width="150" height="88" rx="10" fill="#0f172a" stroke="#a3e635" stroke-width="1.2" stroke-dasharray="6 4"/>
 <text x="105" y="370" text-anchor="middle" class="t" font-size="12" fill="#a3e635">Autenticación</text>
 <text x="105" y="386" text-anchor="middle" class="s" font-size="9.5">Basic o sesión + CSRF</text>
 <text x="105" y="400" text-anchor="middle" class="s" font-size="9.5">5 fallos → 429</text>
 <text x="105" y="414" text-anchor="middle" class="s" font-size="9.5">sin clave → 401</text>
 <text x="105" y="430" text-anchor="middle" class="s" font-size="8.5" fill="#a3e635">extensión opcional</text>
</g>
<path d="M105,335 L105,350" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 4"/>

<!-- Ollama -->
<rect x="950" y="70" width="140" height="130" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.6"/>
<text x="1020" y="92" text-anchor="middle" class="t" font-size="12.5">Modelo protegido</text>
<text x="1020" y="108" text-anchor="middle" class="s">intercambiable:</text>
<text x="1020" y="124" text-anchor="middle" class="s" fill="#c4b5fd">Ollama · local</text>
<text x="1020" y="139" text-anchor="middle" class="s" fill="#c4b5fd">Hugging Face</text>
<text x="1020" y="176" text-anchor="middle" class="s" fill="#c4b5fd">modelo de frontera</text>
<text x="1020" y="192" text-anchor="middle" class="s">hoy: Ollama (:11434)</text>
<rect x="950" y="70" width="140" height="130" rx="12" fill="#a78bfa" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.1491;0.1625;0.1958;1.0000"/></rect>

<path d="M170,300 L205,300 L205,155 L1020,155 L1020,430 L205,430 L205,300 L170,300" fill="none" stroke="#1e293b" stroke-width="2"/>
<!-- nodos entrada -->
<g><rect x="240" y="125" width="130" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/><text x="252" y="139" class="num" fill="#22d3ee" font-size="10">1</text><text x="305.0" y="156.0" text-anchor="middle" class="t">Filtrado</text><text x="305.0" y="175" text-anchor="middle" class="s">regex · determinista</text></g>
<g><rect x="400" y="125" width="140" height="60" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="1.6"/><text x="412" y="139" class="num" fill="#fb7185" font-size="10">3</text><text x="470.0" y="156.0" text-anchor="middle" class="t">Clasificación</text><text x="470.0" y="175" text-anchor="middle" class="s">Prompt Guard 2 (hoy)</text></g>
<text x="470" y="119" text-anchor="middle" class="s" font-size="9.5" fill="#fda4af">o cualquier modelo: local, Hugging Face, Jev, de frontera</text>
<g><rect x="570" y="125" width="140" height="60" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.6"/><text x="582" y="139" class="num" fill="#fbbf24" font-size="10">4</text><text x="640.0" y="156.0" text-anchor="middle" class="t">Mín. privilegio</text><text x="640.0" y="175" text-anchor="middle" class="s">regex de dominio</text></g>
<g><rect x="745" y="125" width="145" height="60" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.6"/><text x="757" y="139" class="num" fill="#34d399" font-size="10">2</text><text x="817.5" y="156.0" text-anchor="middle" class="t">Delimitación</text><text x="817.5" y="175" text-anchor="middle" class="s">spotlighting</text></g>
<rect x="240" y="125" width="130" height="60" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.0340;0.0473;0.0807;1.0000"/></rect><rect x="400" y="125" width="140" height="60" rx="10" fill="#fb7185" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.0607;0.0741;0.1074;1.0000"/></rect><rect x="570" y="125" width="140" height="60" rx="10" fill="#fbbf24" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.0879;0.1012;0.1345;1.0000"/></rect><rect x="745" y="125" width="145" height="60" rx="10" fill="#34d399" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.1165;0.1298;0.1631;1.0000"/></rect>
<rect x="400" y="125" width="140" height="60" rx="10" fill="#fb7185" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.5555;0.5688;0.6021;1.0000"/></rect>
<path d="M370,155 L400,155 M540,155 L570,155 M710,155 L745,155" stroke="#475569" stroke-width="1.6" marker-end="url(#p)" fill="none"/>

<!-- aprobacion humana -->
<rect x="240" y="215" width="400" height="50" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="254" y="237" class="num" fill="#fbbf24">5</text>
<text x="440" y="236" text-anchor="middle" class="t">Aprobación humana + rate limit</text>
<text x="440" y="253" text-anchor="middle" class="s" font-size="10">intercepta el bloqueo: encola (429) en vez de rechazar (400)</text>
<rect x="240" y="215" width="400" height="50" rx="10" fill="#fbbf24" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.5867;0.6000;0.6333;1.0000"/></rect>


<!-- memoria de decisiones: lo que una persona rechazo se recuerda -->
<path d="M640,240 L680,240" stroke="#475569" stroke-width="1.6" marker-start="url(#p)" marker-end="url(#p)" fill="none"/>
<g>
 <rect x="680" y="205" width="210" height="70" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6 4"/>
 <ellipse cx="700" cy="224" rx="10" ry="4" fill="none" stroke="#38bdf8"/><path d="M690,224 L690,238 A10,4 0 0 0 710,238 L710,224" fill="none" stroke="#38bdf8"/>
 <text x="800" y="226" text-anchor="middle" class="t" font-size="12">Memoria de decisiones</text>
 <text x="800" y="243" text-anchor="middle" class="s">recuerda rechazos humanos</text>
 <text x="800" y="259" text-anchor="middle" class="s">SQLite · JSON Lines · tu BD</text>
</g>
<text x="890" y="199" text-anchor="end" class="s" font-size="8.5" fill="#38bdf8">extensión opcional</text>
<rect x="680" y="205" width="210" height="70" rx="10" fill="#38bdf8" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0;0.4;0;0" keyTimes="0.0000;0.5900;0.6050;0.6450;0.7700;0.8000;0.8600;1.0000"/></rect>
<g opacity="0">
 <text x="785" y="292" text-anchor="middle" class="s" font-size="9.5" fill="#7dd3fc">la persona rechaza → se guarda</text>
 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5900;0.6000;0.6450;0.6550;1.0000"/>
</g>

<!-- llamada al modelo protegido -->
<path d="M890,155 L950,155" stroke="#475569" stroke-width="1.6" marker-end="url(#p)"/>
<text x="240" y="392" class="h">SALIDA</text>
<g><rect x="560" y="400" width="140" height="60" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="1.6"/><text x="572" y="414" class="num" fill="#fb7185" font-size="10">3</text><text x="630.0" y="431.0" text-anchor="middle" class="t">Clasificación</text><text x="630.0" y="450" text-anchor="middle" class="s">Llama Guard 3 (hoy)</text></g>
<text x="585" y="478" class="s" font-size="9.5" fill="#fda4af">también intercambiable: local o de frontera</text>
<g><rect x="745" y="400" width="145" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6"/><text x="757" y="414" class="num" fill="#22d3ee" font-size="10">1</text><text x="817.5" y="431.0" text-anchor="middle" class="t">Filtrado</text><text x="817.5" y="450" text-anchor="middle" class="s">redacta credenciales</text></g>
<rect x="560" y="400" width="140" height="60" rx="10" fill="#fb7185" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.2584;0.2717;0.3051;1.0000"/></rect><rect x="745" y="400" width="145" height="60" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;0.4;0;0" keyTimes="0.0000;0.2283;0.2417;0.2750;1.0000"/></rect>
<path d="M1020,200 L1020,430 L890,430 M745,430 L700,430 M560,430 L240,430" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#p)"/>

<!-- logging -->
<rect x="240" y="500" width="650" height="52" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.4"/>
<text x="565" y="523" text-anchor="middle" class="t">Registro JSON Lines · resultados/AAAA-MM-DD/eventos.jsonl</text>
<text x="565" y="541" text-anchor="middle" class="s">8 campos base + latencia por pieza · los mecanismos deciden, el endpoint registra</text>
<path d="M565,460 L565,500" stroke="#475569" stroke-dasharray="3 5" class="flujo"/>

<!-- leyenda inferior / subtitulos animados -->
<g><text x="30" y="610" class="s" fill="#34d399">① Una petición legítima se autentica, atraviesa la cadena completa y vuelve con la respuesta revisada.</text><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.0000;0.0067;0.3533;0.3633;1.0000"/></g>
<g><text x="30" y="610" class="s" fill="#fb7185">② Un ataque: la clasificación lo bloquea y la aprobación humana lo encola (429) para revisión.</text><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4000;0.4133;0.6467;0.6600;1.0000"/></g>

<!-- paquete legitimo -->
<g opacity="0">
 <circle r="9" fill="#34d399" filter="url(#g)" opacity=".8"/><circle r="6" fill="#34d399"/>
 <animateMotion dur="30s" repeatCount="indefinite" path="M170,300 L205,300 L205,155 L1020,155 L1020,430 L205,430 L205,300 L170,300" keyPoints="0;1;1" keyTimes="0;0.3667;1" calcMode="linear"/>
 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.0000;0.0033;0.3633;0.3733;1.0000"/>
</g>
