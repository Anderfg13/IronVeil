 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0.9;0;0" keyTimes="0.0000;0.4033;0.6000;0.6267;0.6400;1.0000"/>
</g>
<g opacity="0">
 <rect x="492" y="190" width="185" height="22" rx="6" fill="#7f1d1d" stroke="#fb7185"/>
 <text x="584" y="205" text-anchor="middle" class="s" fill="#fecaca">unsafe → bloqueo en entrada</text>
 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5688;0.5755;0.6467;0.6567;1.0000"/>
</g>

<g><text x="30" y="610" class="s" fill="#38bdf8">③ El mismo mensaje llega otra vez: la memoria recuerda que una persona lo rechazó y lo rechaza al instante (400), sin cola, sin clasificar y sin llamar al modelo.</text><animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6700;0.6800;0.9700;0.9850;1.0000"/></g>
<!-- paquete repetido -->
<g opacity="0">
 <circle r="9" fill="#fb7185" filter="url(#g)" opacity=".8"/><circle r="6" fill="#fb7185"/>
 <animateMotion dur="30s" repeatCount="indefinite" path="M170,300 L800,300 L800,280 L800,300 L170,300" keyPoints="0;0;0.5;0.5;1;1" keyTimes="0;0.68;0.80;0.84;0.93;1" calcMode="linear"/>
 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6800;0.6900;0.9300;0.9400;1.0000"/>
</g>
<g opacity="0">
 <rect x="330" y="316" width="400" height="24" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
 <text x="530" y="332" text-anchor="middle" class="s" fill="#bae6fd">ya rechazado por una persona → 400 al instante</text>
 <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.8000;0.8100;0.9600;0.9700;1.0000"/>
</g>

<!-- SIEM: uno o varios destinos; todos los eventos salen hacia alli, los de ataque son los que alertan -->
<path d="M890,526 L935,526" stroke="#475569" stroke-width="1.6" marker-end="url(#p)" fill="none"/>
<text x="912" y="518" text-anchor="middle" class="s" font-size="8.5">eventos</text>
<g>
