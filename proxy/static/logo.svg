<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IronVeil">
  <!--
    Logo de IronVeil: un escudo de grafito (el hierro) cubierto por un velo de
    vidrio glaciar. Para usar otro, reemplaza este archivo (mismo nombre; si es PNG,
    cambia la ruta en revision.html, login.html y demo.html). Se ve bien de 20 a 160 px.
    Alternativas en docs/identidad/.
  -->
  <defs>
    <linearGradient id="hierro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#47566A"/><stop offset="1" stop-color="#141A21"/></linearGradient>
    <linearGradient id="velo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4E3FF" stop-opacity=".95"/><stop offset=".55" stop-color="#5DAEFF" stop-opacity=".6"/><stop offset="1" stop-color="#1F78E0" stop-opacity=".25"/></linearGradient>
    <clipPath id="e"><path id="s" d="M32 4 55 12.5V31C55 45.5 45.5 55.5 32 60 18.5 55.5 9 45.5 9 31V12.5z"/></clipPath>
  </defs>
  <use href="#s" fill="url(#hierro)"/>
  <g clip-path="url(#e)">
    <path d="M9 4h32C36 22 30 36 14 52L9 48z" fill="url(#velo)"/>
    <path d="M41 4C36 22 30 36 14 52" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <use href="#s" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1"/>
</svg>
