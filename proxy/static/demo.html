<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Chat · IronVeil</title>
  <link rel="icon" href="/revision/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/revision/static/consola.css">
  <link rel="stylesheet" href="/revision/static/demo.css">
</head>
<body class="demo-cuerpo">
  <header class="barra">
    <div class="marca">
      <!-- Logo: reemplaza proxy/static/logo.svg para poner el definitivo. -->
      <img src="/revision/static/logo.svg" alt="" width="34" height="34">
      <div>IronVeil</div>
    </div>
    <div class="relleno"></div>
    <button type="button" class="boton-barra" id="nueva" hidden>Nueva conversación</button>
  </header>

  <main class="demo-chat" id="principal">
    <h1 class="solo-lectores">Chat</h1>

    <div class="demo-hilo" id="hilo" role="log" aria-live="polite" aria-label="Conversación" tabindex="-1">
      <section class="demo-inicio" id="inicio">
        <img src="/revision/static/logo.svg" alt="" width="52" height="52">
        <h2>¿En qué puedo ayudarte?</h2>
      </section>
    </div>

    <form class="demo-compositor" id="formulario" novalidate>
      <label class="solo-lectores" for="mensaje">Mensaje</label>
      <div class="demo-caja">
        <textarea id="mensaje" name="mensaje" rows="1" maxlength="12000" placeholder="Escribe tu mensaje…" autocomplete="off" spellcheck="true"></textarea>
        <div class="demo-controles">
          <div class="demo-campo">
            <label for="modelo">Asistente</label>
            <select id="modelo" name="modelo">
              <option value="soporte">Soporte</option>
              <option value="rrhh">Recursos humanos</option>
            </select>
          </div>
          <div class="relleno"></div>
          <button type="submit" class="demo-enviar" id="enviar">Enviar</button>
        </div>
      </div>
      <p class="demo-ayuda">Enter envía, Mayús+Enter agrega una línea. Cada mensaje se responde por separado.</p>
    </form>
  </main>

  <div class="solo-lectores" id="anuncios" role="status" aria-live="polite"></div>
  <script src="/revision/static/demo.js"></script>
</body>
</html>
