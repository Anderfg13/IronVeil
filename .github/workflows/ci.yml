name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias (pines exactos)
        run: pip install -r requirements-dev.txt
      - name: Lint y formato
        run: |
          ruff check .
          black --check .
      - name: Pruebas (no necesitan Ollama ni Docker: el clasificador va con mocks)
        run: python -m pytest -q

  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: El paquete se construye y su metadata es valida
        run: |
          pip install --only-binary :all: build==1.2.2.post1 twine==6.1.0
          python -m build
          twine check dist/*
