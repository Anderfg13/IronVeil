name: Publicar sitio (GitHub Pages)

# Publica el visor interactivo y los diagramas animados en
# https://<usuario>.github.io/IronVeil/ . Requiere, una sola vez:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [main]
    paths: ["docs/sitio/**", "docs/diagramas/**", "docs/assets/**", ".github/workflows/pages.yml"]
    tags: ["entrega-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Armar el sitio
        run: |
          mkdir -p _sitio
          cp docs/sitio/index.html _sitio/index.html
          cp -r docs/diagramas _sitio/diagramas
          cp -r docs/assets _sitio/assets
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
